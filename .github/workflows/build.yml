name: Build DhakaFlix

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Install Apktool
        run: |
          mkdir -p $HOME/.local/bin
          wget https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O $HOME/.local/bin/apktool
          wget https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.12.0.jar -O $HOME/.local/bin/apktool.jar
          chmod +x $HOME/.local/bin/apktool $HOME/.local/bin/apktool.jar
          echo "$HOME/.local/bin" >> $GITHUB_PATH
      - name: Bump Version
        run: |
          chmod +x .github/scripts/update_version.sh
          ./.github/scripts/update_version.sh ${{ github.run_number }}
      - name: Build APK
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_SDK_ROOT/build-tools -maxdepth 2 -type d -name "3*" | sort -r | head -n 1)
          export PATH=$PATH:$BUILD_TOOLS_DIR
          chmod +x .github/scripts/auto_fix_build.sh
          ./.github/scripts/auto_fix_build.sh
      - name: Sign APK
        run: |
          APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -r | head -n 1)
          "$APKSIGNER" sign --ks keystore.jks --ks-pass "pass:dflix123" --key-pass "pass:dflix123" --out dhakaflix-v14.${{ github.run_number }}.apk dhakaflix-unsigned.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v14.${{ github.run_number }}
          files: dhakaflix-v14.${{ github.run_number }}.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Repo Index
        run: |
          pip install PyYAML
          python .github/scripts/generate_repo.py
          mkdir repo_dist
          mv index.min.json repo_dist/
          mv repo.json repo_dist/
          cp dhakaflix-v14.${{ github.run_number }}.apk repo_dist/
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: repo
          publish_dir: repo_dist
          keep_files: true
      - name: Push to Extensions Repo
        run: |
          REPO_DIR="extensions-repo-tmp"
          git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/salmanbappi/extensions-repo.git $REPO_DIR
          PKG_NAME="eu.kanade.tachiyomi.animeextension.all.dhakaflix"
          VERSION_CODE="${{ github.run_number }}"
          VERSION_NAME="14.$VERSION_CODE"
          TARGET_NAME="$PKG_NAME-v$VERSION_NAME-c$VERSION_CODE.apk"
          mkdir -p $REPO_DIR/apk
          cp dhakaflix-v14.$VERSION_CODE.apk $REPO_DIR/apk/$TARGET_NAME
          cd $REPO_DIR
          git config user.name "Gemini Automation"
          git config user.email "gemini@automation.bot"
          git add apk/$TARGET_NAME
          git commit -m "Update DhakaFlix to v$VERSION_NAME"
          git push
